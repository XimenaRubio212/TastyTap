<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TastyTap | Admin Logs</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar" style="background-color: #2c3e50;">
        <div class="navbar__logo"><h1 style="color: white;">Admin Panel</h1></div>
        <nav class="navbar__menu">
            <a href="/views/Admin/seguridad.html" style="color: white;">Roles</a>
            <a href="/views/Admin/mantenimiento.html" style="color: white;">Mantenimiento</a>
            <a href="/views/Admin/logs-servidor.html" class="active" style="color: white;">Balances</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h2 class="main-title">Balances y Operaciones</h2>
            <p>Monitoreo financiero: Ingresos globales vs Gastos operativos.</p>
        </section>

        <!-- RF12: Presentación gráfica resumida -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="card" style="padding: 20px; border-left: 5px solid #2ecc71;">
                <h4>Ventas Totales</h4>
                <h2 style="color: #27ae60;">$12.450.000</h2>
            </div>
            <div class="card" style="padding: 20px; border-left: 5px solid #e74c3c;">
                <h4>Gastos Operativos</h4>
                <h2 style="color: #c0392b;">$2.100.000</h2>
            </div>
            <div class="card" style="padding: 20px; border-left: 5px solid #f1c40f;">
                <h4>Balance Neto</h4>
                <h2 style="color: #f39c12;">$10.350.000</h2>
            </div>
        </div>

        <!-- RF11: Registro de gastos -->
        <div class="card" style="padding: 20px;">
            <h3>Gastos de Operación</h3>
            <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                <tr style="background: #f8f9fa;">
                    <th style="padding: 10px;">Fecha</th>
                    <th style="padding: 10px;">Concepto</th>
                    <th style="padding: 10px;">Monto</th>
                </tr>
                <tr>
                    <td style="padding: 10px;">07/02/2024</td>
                    <td style="padding: 10px;">Pago Servidores AWS</td>
                    <td style="padding: 10px;">$450.000</td>
                </tr>
            </table>
        </div>
    </main>
</body>
</html>
